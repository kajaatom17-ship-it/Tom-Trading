name: Moteur paper trading

on:
  schedule:
    - cron: "*/5 * * * *"        # toutes les 5 min (GitHub peut retarder de quelques minutes)
  push:
    paths:
      - "docs/data/inbox/**"     # une decision du comite declenche une execution immediate
  workflow_dispatch: {}

concurrency:
  group: moteur
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tick du moteur (prix Kraken publics, aucun ordre reel)
        run: python engine/tick.py
      - name: Sauvegarde de l'etat
        run: |
          git config user.name "moteur-paper"
          git config user.email "moteur-paper@users.noreply.github.com"
          git add docs/data archive
          git diff --cached --quiet && exit 0
          git commit -m "tick $(date -u +%H:%M)Z" -q
          for i in 1 2 3; do git push -q && exit 0; git pull --rebase -q -X theirs || true; done
          exit 1
