name: Moteur paper trading

on:
  schedule:
    - cron: "*/5 * * * *"        # toutes les 5 min (GitHub peut retarder de quelques minutes)
  push:
    paths:
      - "docs/data/inbox/**"     # une decision du comite declenche une execution immediate
  workflow_dispatch: {}

concurrency:
  group: moteur
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Moteur en boucle (un passage par minute pendant ~4 min, aucun ordre reel)
        run: |
          git config user.name "moteur-paper"
          git config user.email "moteur-paper@users.noreply.github.com"
          for i in 1 2 3 4; do
            if [ "$i" = "1" ]; then python engine/tick.py; else python engine/tick.py --no-scan; fi
            git add docs/data archive
            if ! git diff --cached --quiet; then
              git commit -m "tick $(date -u +%H:%M)Z" -q
              for j in 1 2 3; do git push -q && break; git pull --rebase -q -X theirs || true; done
            fi
            [ "$i" = "4" ] || sleep 45
          done
